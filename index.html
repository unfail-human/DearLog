<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Dearlog — SNS Maker</title>
  <meta name="description" content="창작 캐릭터와 이야기용 SNS 이미지 메이커 Dearlog">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="Dearlog">
      <span class="brand-mark">✦</span>
      <span class="brand-name">Dearlog</span>
      <span class="brand-sub">SNS MAKER</span>
    </a>
    <div class="top-actions">
      <button class="btn btn-subtle" id="resetBtn">초기화</button>
      <button class="btn btn-primary" id="exportBtn">PNG 저장</button>
    </div>
  </header>

  <main class="app">
    <aside class="sidebar">
      <section class="intro">
        <div class="kicker">DEARLOG MAKER</div>
        <h1>가상의 SNS를<br>자유롭게 만들어보세요.</h1>
        <p>템플릿을 고른 뒤 이름, 아이디, 글, 사진을 원하는 대로 바꿀 수 있어요.</p>
      </section>

      <section class="tool-section">
        <div class="section-title">
          <span>템플릿</span>
          <small>3 TYPES</small>
        </div>
        <div class="template-grid" id="templateGrid">
          <button class="template-card active" data-template="x">
            <span class="template-icon">𝕏</span>
            <span><b>X형</b><small>POST / REPLY</small></span>
          </button>
          <button class="template-card" data-template="instagram">
            <span class="template-icon">◎</span>
            <span><b>Instagram형</b><small>FEED / PHOTO</small></span>
          </button>
          <button class="template-card" data-template="dm">
            <span class="template-icon">◌</span>
            <span><b>DM형</b><small>MESSAGE / CHAT</small></span>
          </button>
        </div>
      </section>

      <section class="tool-section">
        <div class="section-title"><span>프로필</span></div>
        <label class="field">
          <span>이름</span>
          <input id="nameInput" type="text" value="Dearlog" maxlength="30">
        </label>
        <label class="field">
          <span>아이디</span>
          <div class="prefix-input"><i>@</i><input id="handleInput" type="text" value="dearlog" maxlength="30"></div>
        </label>
        <label class="field">
          <span>프로필 이미지</span>
          <span class="file-button">이미지 선택<input id="avatarInput" type="file" accept="image/*"></span>
        </label>
      </section>

      <section class="tool-section" id="appearanceSection">
        <div class="section-title"><span>화면 꾸미기</span></div>
        <div class="color-row">
          <label><span>배경</span><input id="bgColor" type="color" value="#f5f7fb"></label>
          <label><span>카드</span><input id="cardColor" type="color" value="#ffffff"></label>
          <label><span>포인트</span><input id="accentColor" type="color" value="#7896c6"></label>
        </div>
        <label class="toggle-row">
          <span><b>다크 모드</b><small>미리보기만 어둡게 전환</small></span>
          <input id="darkToggle" type="checkbox">
        </label>
      </section>

      <section class="tool-section" id="contentControls">
        <div class="section-title"><span>콘텐츠</span></div>
        <div class="button-stack">
          <button class="btn btn-wide" id="addItemBtn">＋ 항목 추가</button>
          <button class="btn btn-wide btn-danger" id="removeItemBtn">− 마지막 항목 삭제</button>
        </div>
      </section>

      <div class="tip">
        <b>TIP</b>
        <span>미리보기 안의 글자를 클릭하면 대부분 바로 수정할 수 있어요.</span>
      </div>
    </aside>

    <section class="stage">
      <div class="stage-top">
        <div>
          <b id="stageTitle">X형 템플릿</b>
          <span id="stageDesc">게시물과 답글을 만들어보세요.</span>
        </div>
        <span class="editing-badge">LIVE EDIT</span>
      </div>

      <div class="capture-shell">
        <div class="capture" id="captureArea"></div>
      </div>
    </section>
  </main>

  <input id="avatarHidden" type="file" accept="image/*" hidden>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
